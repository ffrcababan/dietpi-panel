# dietpi-panel:name=__NAME__
# dietpi-panel:type=dbonly
<VirtualHost *:80>
    ServerName __DOMAIN__
    DocumentRoot /var/www/__NAME__

    <Directory /var/www/__NAME__>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all denied
        <Files "db.php">
            Require all granted
        </Files>
    </Directory>

    IncludeOptional /etc/apache2/conf-app-db/__NAME__.conf

    ErrorLog ${APACHE_LOG_DIR}/__NAME__-db-error.log
    CustomLog ${APACHE_LOG_DIR}/__NAME__-db-access.log combined
</VirtualHost>
