# dietpi-panel:name=__NAME__
# dietpi-panel:type=laravel
<VirtualHost *:80>
    ServerName __DOMAIN__
    DocumentRoot /var/www/__NAME__/public
    DirectoryIndex index.php index.html

    <Directory /var/www/__NAME__/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /db.php /var/www/_shared/db.php
    <Directory /var/www/_shared>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    IncludeOptional __CONF_DB_DIR__/__NAME__.conf

    ErrorLog ${APACHE_LOG_DIR}/__NAME__-error.log
    CustomLog ${APACHE_LOG_DIR}/__NAME__-access.log combined
</VirtualHost>
