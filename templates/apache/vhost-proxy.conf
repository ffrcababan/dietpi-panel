# dietpi-panel:name=__NAME__
# dietpi-panel:type=__TYPE__
# dietpi-panel:port=__PORT__
<VirtualHost *:80>
    ServerName __DOMAIN__
    DocumentRoot /var/www/__NAME__

    <Directory /var/www/__NAME__>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        <FilesMatch "^(?!db\.php$).+\.php$">
            Require all denied
        </FilesMatch>
    </Directory>

    Alias /db.php /var/www/_shared/db.php
    <Directory /var/www/_shared>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    IncludeOptional /etc/apache2/conf-app-db/__NAME__.conf

    ProxyPreserveHost On
    ProxyTimeout 60
    RequestHeader setifempty X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS

    ProxyPass /db.php !
    ProxyPass / http://127.0.0.1:__PORT__/
    ProxyPassReverse / http://127.0.0.1:__PORT__/

    ErrorLog ${APACHE_LOG_DIR}/__NAME__-error.log
    CustomLog ${APACHE_LOG_DIR}/__NAME__-access.log combined
</VirtualHost>
