# dietpi-panel:name=__NAME__
# dietpi-panel:type=__TYPE__
<VirtualHost *:80>
    ServerName __DOMAIN__
    DocumentRoot __DOCROOT__
    DirectoryIndex index.html

    <Directory __DOCROOT__>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        __FALLBACK_DIRECTIVE__

        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </Directory>

    Alias /db.php /var/www/_shared/db.php
    <Directory /var/www/_shared>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    IncludeOptional __CONF_DB_DIR__/__NAME__.conf

    ErrorLog ${APACHE_LOG_DIR}/__NAME__-error.log
    CustomLog ${APACHE_LOG_DIR}/__NAME__-access.log combined
</VirtualHost>
